name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Ensure Android Permissions in AndroidManifest.xml
        run: |
          # Inject microphone and audio record permissions if not already present
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            fi
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalVoice-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary Notice
        run: |
          echo "### 🚀 APK ಬಿಲ್ಡ್ ಯಶಸ್ವಿಯಾಗಿದೆ! (APK Build Successful)" >> $GITHUB_STEP_SUMMARY
          echo "Android APK ಫೈಲ್ ಅನ್ನು ಮೇಲಿನ 'Artifacts' ವಿಭಾಗದಲ್ಲಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿಕೊಳ್ಳಬಹುದು." >> $GITHUB_STEP_SUMMARY
          echo "File: CrystalVoice-Android-APK (`app-debug.apk`)" >> $GITHUB_STEP_SUMMARY
