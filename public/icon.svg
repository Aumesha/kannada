<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Audio Wave Rings (Noise Cancellation Shield) -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="12 10" opacity="0.4" />
  <circle cx="256" cy="230" r="170" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.3" />
  <circle cx="256" cy="230" r="200" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 8" opacity="0.25" />

  <!-- Sound Waves / Frequency bars -->
  <line x1="86" y1="230" x2="86" y2="230" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  <line x1="104" y1="210" x2="104" y2="250" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <line x1="122" y1="190" x2="122" y2="270" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <line x1="390" y1="190" x2="390" y2="270" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <line x1="408" y1="210" x2="408" y2="250" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <line x1="426" y1="230" x2="426" y2="230" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Studio Microphone Capsule -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="208" y="140" width="96" height="150" rx="48" fill="url(#cyanGrad)" />
    <!-- Mic Grille Lines -->
    <line x1="224" y1="190" x2="288" y2="190" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="220" y1="210" x2="292" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="228" y1="230" x2="284" y2="230" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Mic Cradle / U-mount -->
    <path d="M 180 230 C 180 300, 332 300, 332 230" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
    
    <!-- Mic Stem & Base -->
    <line x1="256" y1="300" x2="256" y2="370" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
    <rect x="186" y="370" width="140" height="20" rx="10" fill="#f8fafc" />
    <rect x="216" y="390" width="80" height="12" rx="6" fill="#64748b" />
  </g>

  <!-- Noise Filter Active Pulse Indicator (Green sparkle / shield) -->
  <circle cx="256" cy="116" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="116" r="7" fill="#ffffff" />
</svg>
